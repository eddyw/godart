name: CI

on:
  workflow_dispatch:
    inputs:
      upstream_mode:
        description: Upstream Go test mode
        type: choice
        default: short
        options: [short, full]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.matrix.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: echo "jobs=$(python3 -c 'import json; print(json.dumps(json.load(open("scripts/ci-matrix.json"))))')" >> "$GITHUB_OUTPUT"

  suites:
    name: ${{ matrix.suite }} / ${{ matrix.shard }} / ${{ matrix.runner || 'ubuntu-24.04' }}
    needs: matrix
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.upstream_mode == 'full' && matrix.full_job_timeout || matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7
      - id: sdk
        name: Read SDK baseline
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          versions = json.loads(Path("internal/sdk/compatibility.json").read_text())
          print(f"go={versions['go']['baseline']}")
          print(f"dart={versions['dart']['baseline']}")
          PY
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.sdk.outputs.go }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ steps.sdk.outputs.dart }}
      - uses: actions/setup-node@v7
        if: matrix.suite == 'language-targets' || matrix.suite == 'targets' || matrix.suite == 'upstream-targets' || matrix.suite == 'upstream-priority' || matrix.suite == 'web-io' || matrix.suite == 'web-fetch'
        with:
          node-version: '26.8.2'
      - name: Install upstream test tools
        if: matrix.suite == 'stdlib'
        run: sudo apt-get update && sudo apt-get install -y zstd xxhash
      - run: make get
      - name: Compile driver tests
        if: matrix.suite != 'checks'
        run: go test -c -o "$RUNNER_TEMP/driver.test" ./internal/driver
      - name: Keep expected rejections out of error annotations
        if: matrix.suite == 'language' || matrix.suite == 'language-compile'
        run: echo '::remove-matcher owner=go::'
      - name: Run the complete suite shard
        timeout-minutes: ${{ inputs.upstream_mode == 'full' && matrix.full_timeout || matrix.timeout }}
        env:
          GART_UPSTREAM_MODE: ${{ inputs.upstream_mode }}
          GART_TEST_TIMEOUT: ${{ inputs.upstream_mode == 'full' && matrix.full_timeout || matrix.timeout }}m
          GART_PARITY_REPORT_DIR: ${{ github.workspace }}/build/parity-results
        run: bash scripts/ci.sh '${{ matrix.suite }}' '${{ matrix.shard }}' '${{ matrix.shards }}' 2>&1 | tee ci.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-${{ matrix.suite }}-${{ matrix.shard }}-${{ runner.os }}
          path: |
            ci.log
            build/parity-results
          retention-days: 7
