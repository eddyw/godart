name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.matrix.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: echo "jobs=$(python3 -c 'import json; print(json.dumps(json.load(open("scripts/ci-matrix.json"))))')" >> "$GITHUB_OUTPUT"

  suites:
    name: ${{ matrix.suite }} / ${{ matrix.shard }}
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'
      - uses: actions/setup-node@v7
        if: matrix.suite == 'targets' || matrix.suite == 'web-io' || matrix.suite == 'web-fetch'
        with:
          node-version: '26.8.2'
      - run: make get
      - name: Compile driver tests
        if: matrix.suite != 'checks'
        run: go test -c -o "$RUNNER_TEMP/driver.test" ./internal/driver
      - name: Keep expected rejections out of error annotations
        if: matrix.suite == 'language'
        run: echo '::remove-matcher owner=go::'
      - name: Run the complete suite shard
        timeout-minutes: ${{ matrix.timeout }}
        env:
          GART_TEST_TIMEOUT: ${{ matrix.timeout }}m
        run: bash scripts/ci.sh '${{ matrix.suite }}' '${{ matrix.shard }}' '${{ matrix.shards }}' 2>&1 | tee ci.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-${{ matrix.suite }}-${{ matrix.shard }}
          path: ci.log
          retention-days: 7
