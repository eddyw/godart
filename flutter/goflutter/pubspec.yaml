name: goflutter
description: The Flutter host of a Go widget tree. It reads the tree that a gart build gives, and it builds real Flutter widgets from it.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Flutter moved Material and Cupertino out of the framework. The hand
  # written nodes of the host read TextField, MaterialPage, ThemeData, and
  # CupertinoThemeData, thus the host names the 2 packages.
  material_ui: ^1.1.1
  cupertino_ui: ^1.0.2
  goruntime:
    path: ../../runtime/goruntime

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
