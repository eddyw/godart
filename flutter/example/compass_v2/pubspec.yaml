name: compass_v2
description: The Compass sample with Go screens and native Flutter widgets.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.1
  cached_network_image: ^3.4.1
  octo_image: ^2.1.0
  flutter_svg: ^2.2.1
  share_plus: ^11.1.0
  goflutter:
    path: ../../goflutter
  gocompass_v2:
    path: gen
  goruntime:
    path: ../../../runtime/goruntime

dev_dependencies:
  file: ^7.0.1
  flutter_cache_manager: ^3.4.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/user.jpg
    - assets/photos/
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-ExtraBold.ttf
          weight: 800
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
