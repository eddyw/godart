name: compass_app
description: The Flutter sample compass_app, with the whole application in Go.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.1
  # The logo of the login screen. gart.dev/ui/svg holds the node types of this
  # package, and nodegen wrote them with no change of the reader.
  flutter_svg: ^2.2.1
  # The share sheet of the platform. A Go tree carries no call of Dart, thus
  # ui.Share reaches this plugin through the handler of goSetCall.
  share_plus: ^11.1.0
  goflutter:
    path: ../../goflutter
  gocompass:
    path: gen
  goruntime:
    path: ../../../runtime/goruntime

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/activities.json
    - assets/destinations.json
    - assets/logo.svg
    - assets/user.jpg
  # The sample reads the 2 faces from google_fonts. That package holds no
  # widget, thus no pack of nodegen reaches it, and this port ships the 2
  # files. Each 1 is a variable font, thus a style names the axis wght.
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans.ttf
